name: basic-ci
run-name: ${{ github.actor }} - basic ci on push / tag
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-upload_artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Verify installation
        run: |
          uv run python --version
          uv --version

      - name: Check release tag matches package version
        if: github.ref_type == 'tag'
        run: uv run python scripts/check-release-version.py

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Smoke-test installed wheel
        timeout-minutes: 2
        env:
          SENSOR_ID: ci-smoke
          POLL_INTERVAL_SECONDS: "0.1"
          PORT: "8765"
        run: bash scripts/smoke-test.sh

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: sensor-agent-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
